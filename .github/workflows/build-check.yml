# Rebuilds the posts, feed, and sitemap and fails if the committed output under site/ is stale.
name: Build check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Generated files must be committed
        run: git diff --exit-code -- site
